<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineDB | Cyberpunk Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>CINE_DB<span class="blink">_</span></h2>
            </div>
            <ul class="nav-links">
                <li class="active" data-view="movies">> Movies</li>
                <li data-view="actors">> Actors</li>
                <li data-view="directors">> Directors</li>
                <li data-view="producers">> Producers</li>
                <li data-view="crew">> Crew</li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="content-area">
            <header class="content-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px;">
                    <h1 id="view-title" style="margin-bottom: 0; border: none; padding: 0;">Initializing...</h1>
                    <div id="movie-filters" class="filters hidden">
                        <button class="filter-btn active" data-filter="all">[ ALL ]</button>
                        <button class="filter-btn" data-filter="draft">[ DRAFTS ]</button>
                        <button class="filter-btn" data-filter="published">[ PUBLISHED ]</button>
                    </div>
                </div>
            </header>

            <div class="table-container" style="display: none;">
                <table id="data-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
            
            <div id="dynamic-view"></div>
        </main>
    </div>

    <!-- Add Record Modal -->
    <div id="add-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">>> SYS.INSERT_RECORD</h3>
                <span class="close-btn" id="modal-close">&times;</span>
            </div>
            <div class="modal-body" id="modal-form-container">
                <!-- Inputs injected by JS -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-glow" id="modal-submit">EXECUTE_INSERT()</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay hidden">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header">
                <h3 id="detail-title">>> SYS.DETAILS</h3>
                <span class="close-btn" id="detail-close">&times;</span>
            </div>
            <div class="modal-body" id="detail-body">
                <!-- dynamic content -->
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
